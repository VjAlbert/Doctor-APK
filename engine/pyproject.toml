[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apkguard-engine"
version = "0.1.0"
description = "APKGuard analysis engine: static analysis of Android APK files"
requires-python = ">=3.10"
dependencies = ["androguard>=4.1", "yara-python>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apkguard = "apkguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apkguard = ["i18n/*.json", "rules/*.yar", "rules/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
