name: build

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4  # keytool/jarsigner build the fixture APKs
        with: { distribution: temurin, java-version: "17" }
      - name: Engine tests
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=tests pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: UI checks
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # also gives build_engine.py the target triple
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the engine executable (sidecar)
        run: |
          pip install ./engine pyinstaller
          python packaging/build_engine.py
      - name: Smoke-test the engine executable
        shell: bash
        run: |
          exe=$(ls packaging/dist/apkguard*)
          "$exe" --version
      - name: Build the desktop app
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: apkguard-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/**
          if-no-files-found: error
