name: build

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4  # keytool/jarsigner build the fixture APKs
        with: { distribution: temurin, java-version: "17" }
      - name: Engine tests
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=tests pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: UI checks
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # also gives build_engine.py the target triple
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the engine executable (sidecar)
        shell: bash
        run: |
          python packaging/stamp_build.py
          pip install ./engine pyinstaller
          python packaging/build_engine.py
      - name: Smoke-test the engine executable
        shell: bash
        run: |
          exe=$(ls packaging/dist/apkguard*)
          "$exe" --version | tee version.txt
          grep -q "build ${GITHUB_SHA:0:7}" version.txt  # the frozen engine must be this commit
      - name: Build the desktop app
        working-directory: app
        shell: bash
        env:
          VITE_BUILD: ${{ github.sha }}
          # linuxdeploy (AppImage) cannot use FUSE on hosted runners
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          npm ci
          set +e
          npx tauri build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface the tail of the log as an annotation: readable without downloading logs
            echo "::error title=tauri build failed::$(tail -n 40 build.log | sed 's/\r//' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: apkguard-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/**
          if-no-files-found: error
